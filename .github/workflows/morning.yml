name: Morning brief

on:
  schedule:
    # GitHub cron is UTC only. Each message is scheduled at the two UTC hours
    # that can match the local target hour (before and after a clock change);
    # schedule_check.py keeps the one that matches TIMEZONE and skips the other.
    # These hours suit a UTC+0 / UTC+1 timezone: adjust them for yours.
    - cron: "0 6 * * *"   # morning (07:00 local at UTC+1)
    - cron: "0 7 * * *"   # morning (07:00 local at UTC+0)
    - cron: "0 20 * * *"  # evening (21:00 local at UTC+1)
    - cron: "0 21 * * *"  # evening (21:00 local at UTC+0)
    - cron: "0 19 * * 0"  # weekly, Sunday (20:00 local at UTC+1)
    - cron: "0 20 * * 0"  # weekly, Sunday (20:00 local at UTC+0)
  workflow_dispatch:
    inputs:
      mode:
        description: "Which message to send"
        type: choice
        options: [morning, evening, weekly]
        default: morning
      simulate_failure:
        description: "Fail on purpose to test the failure alert (nothing is sent)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
    env:
      # Use the pinned tzdata package for timezone rules, not the runner's
      # system copy, which may lag behind recent clock-change decisions.
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check local hour
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          TIMEZONE: ${{ secrets.TIMEZONE || vars.TIMEZONE }}
          MORNING_HOUR: ${{ vars.MORNING_HOUR }}
          EVENING_HOUR: ${{ vars.EVENING_HOUR }}
          WEEKLY_HOUR: ${{ vars.WEEKLY_HOUR }}
        run: |
          python -m pip install --quiet --disable-pip-version-check "tzdata>=2026.6"
          python schedule_check.py

      - name: Simulate failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Failing on purpose to test the alert."
          exit 1

      - if: steps.gate.outputs.send == 'true'
        run: pip install -r requirements.txt

      - name: Send message
        if: steps.gate.outputs.send == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Empty when the secret is not set -> falls back to deadlines.example.json
          DEADLINES_JSON: ${{ secrets.DEADLINES_JSON }}
          # Private; empty when unset -> falls back to the *.example.json files
          SELF_TALK_JSON: ${{ secrets.SELF_TALK_JSON }}
          NIGHT_NOTES_JSON: ${{ secrets.NIGHT_NOTES_JSON }}
          WORDS_JSON: ${{ secrets.WORDS_JSON }}
          # Private iCal URLs; empty when unset -> agenda sections are skipped
          GCAL_ICS_URLS: ${{ secrets.GCAL_ICS_URLS }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          LATITUDE: ${{ secrets.LATITUDE || vars.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE || vars.LONGITUDE }}
          CITY_NAME: ${{ secrets.CITY_NAME || vars.CITY_NAME }}
          TIMEZONE: ${{ secrets.TIMEZONE || vars.TIMEZONE }}
          ENABLE_QURAN: ${{ secrets.ENABLE_QURAN || vars.ENABLE_QURAN }}
          ENABLE_SELF_TALK: ${{ secrets.ENABLE_SELF_TALK || vars.ENABLE_SELF_TALK }}
          ENABLE_WORD: ${{ secrets.ENABLE_WORD || vars.ENABLE_WORD }}
          ENABLE_EVENING: ${{ secrets.ENABLE_EVENING || vars.ENABLE_EVENING }}
          ENABLE_EVENING_VERSE: ${{ secrets.ENABLE_EVENING_VERSE || vars.ENABLE_EVENING_VERSE }}
          ENABLE_NIGHT_NOTE: ${{ secrets.ENABLE_NIGHT_NOTE || vars.ENABLE_NIGHT_NOTE }}
          ENABLE_WEEKLY: ${{ secrets.ENABLE_WEEKLY || vars.ENABLE_WEEKLY }}
        run: python main.py ${{ steps.gate.outputs.mode == 'evening' && '--evening' || steps.gate.outputs.mode == 'weekly' && '--weekly' || '' }}

  # Sends a short fixed alert if the brief job fails. No secret or private
  # content is included, and the Telegram API response is discarded.
  alert-on-failure:
    needs: brief
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LABEL: ${{ needs.brief.outputs.mode == 'evening' && 'Message du soir' || needs.brief.outputs.mode == 'weekly' && 'Résumé de la semaine' || 'Morning brief' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ ${LABEL} a échoué
          ${RUN_URL}")
          echo "Telegram API status: ${status}"
          test "${status}" = "200"

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API resets that timer,
  # without any commit.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT --silent \
            "repos/${{ github.repository }}/actions/workflows/morning.yml/enable"
          echo "Workflow re-enabled; inactivity timer reset."
