name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same timezone rules as the scheduled workflow (pinned tzdata package).
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Locked versions, verified hashes, wheels only (no setup scripts).
      - name: Install
        run: "pip install --only-binary :all: --require-hashes -r requirements-dev.txt"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
