name: Morning brief

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC every day
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail on purpose to test the failure alert (no brief is sent)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Simulate failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Failing on purpose to test the alert."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send morning brief
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Empty when the secret is not set -> falls back to deadlines.example.json
          DEADLINES_JSON: ${{ secrets.DEADLINES_JSON }}
          # Private; empty when unset -> falls back to self_talk.example.json
          SELF_TALK_JSON: ${{ secrets.SELF_TALK_JSON }}
          # Private iCal URLs; empty when unset -> agenda section is skipped
          GCAL_ICS_URLS: ${{ secrets.GCAL_ICS_URLS }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          LATITUDE: ${{ secrets.LATITUDE || vars.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE || vars.LONGITUDE }}
          CITY_NAME: ${{ secrets.CITY_NAME || vars.CITY_NAME }}
          TIMEZONE: ${{ secrets.TIMEZONE || vars.TIMEZONE }}
          ENABLE_QURAN: ${{ secrets.ENABLE_QURAN || vars.ENABLE_QURAN }}
          ENABLE_SELF_TALK: ${{ secrets.ENABLE_SELF_TALK || vars.ENABLE_SELF_TALK }}
          ENABLE_WORD: ${{ secrets.ENABLE_WORD || vars.ENABLE_WORD }}
        run: python main.py

  # Sends a short fixed alert if the brief job fails. No secret or private
  # content is included, and the Telegram API response is discarded.
  alert-on-failure:
    needs: brief
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Morning brief a échoué
          ${RUN_URL}")
          echo "Telegram API status: ${status}"
          test "${status}" = "200"

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API resets that timer,
  # without any commit.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT --silent \
            "repos/${{ github.repository }}/actions/workflows/morning.yml/enable"
          echo "Workflow re-enabled; inactivity timer reset."
